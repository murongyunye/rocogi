# 55 components of the merged suite (39 native + 16 vendor). Every component has an owning engine, an entry command,
# a config file, a dependency list, a status and an `implemented` flag.
# status       = ready | not-wired | blocked-vendor | skipped | missing-deps (+reason)
# blocked-vendor = the upstream source is imported and its contract is exported, but it
#                  cannot run end-to-end without an external prerequisite (driver/SDK/data)
# implemented  = the entry really executes code for this component (not a placeholder)
# "rocogi-suite engines --verify" runs every distinct entry and requires structured output.


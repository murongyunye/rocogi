name: build-engines

on:
  workflow_dispatch:
  push:
    tags:
      - "engine-*"

jobs:
  windows-engines:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller
      - name: Build headless engines
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/build-engines.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rocogi-engines-windows
          path: dist/engines/*
